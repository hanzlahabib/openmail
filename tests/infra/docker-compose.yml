# Disposable OpenMail test mail server. TEST-ONLY credentials and ports; never expose publicly.
# Image pinned by digest (greenmail/standalone:2.1.3).
name: openmail-test-infra
services:
  greenmail:
    image: greenmail/standalone@sha256:d6db42a4fc258fec0948b1ae7b579fd06947cc92087c162ec0597972a6c36850
    container_name: openmail-test-greenmail
    restart: "no"
    network_mode: bridge   # default bridge: avoids exhausting docker address pools on busy hosts
    ports:
      - "127.0.0.1:13143:3143"   # IMAP (plain)
      - "127.0.0.1:13993:3993"   # IMAPS (self-signed)
      - "127.0.0.1:13025:3025"   # SMTP (plain)
      - "127.0.0.1:13465:3465"   # SMTPS (self-signed)
      - "127.0.0.1:18080:8080"   # GreenMail REST API
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=alice:alicepass@openmail.test,bob:bobpass@openmail.test,carol:carolpass@openmail.test
        -Dgreenmail.verbose
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3143"]
      interval: 3s
      timeout: 3s
      retries: 20
