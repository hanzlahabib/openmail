tracing.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
# bundled: ship our own SQLite so the store behaves identically on every platform.
rusqlite = { version = "0.43", features = ["bundled"] }
chrono = "0.4.45"
chrono-tz = "0.10.4"
croner = "5.0.0"
futures-util = "0.3.34"
regex = "1.13.2"

[dev-dependencies]
openmail-imap.workspace = true
async-imap.workspace = true
rcgen.workspace = true
tokio-rustls.workspace = true
tempfile = "3"
base64.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
