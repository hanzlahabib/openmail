[package]
name = "openmail-cli"
description = "OpenMail MCP command line (binary: openmail-mcp)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "openmail-mcp"
path = "src/main.rs"

[dependencies]
openmail-authserver = { path = "../openmail-authserver" }
openmail-briefs.workspace = true
openmail-core.workspace = true
openmail-observe = { path = "../openmail-observe" }
openmail-imap.workspace = true
openmail-mcp.workspace = true
openmail-security.workspace = true
openmail-remote = { path = "../openmail-remote" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
openmail-smtp.workspace = true
chrono = "0.4.45"
url = "2.5.8"
anyhow.workspace = true
tokio.workspace = true
secrecy.workspace = true
serde_json.workspace = true

rpassword = "7.5"
toml.workspace = true
clap = { version = "4.6", features = ["derive", "env"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
tempfile = "3"
assert_cmd = "2.2"
async-imap.workspace = true
rcgen.workspace = true
tokio-rustls.workspace = true
base64.workspace = true
sha2.workspace = true

[lints]
workspace = true
