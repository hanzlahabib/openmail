[package]
name = "openmail-cli"
description = "OpenMail MCP command line (binary: openmail-mcp)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "openmail-mcp"
path = "src/main.rs"

[dependencies]
openmail-core.workspace = true
openmail-imap.workspace = true
openmail-mcp.workspace = true
openmail-security.workspace = true
anyhow.workspace = true
tokio.workspace = true
secrecy.workspace = true

clap = { version = "4.6", features = ["derive", "env"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
assert_cmd = "2.2"

[lints]
workspace = true
