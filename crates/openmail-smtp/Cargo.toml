[package]
name = "openmail-smtp"
description = "OpenMail MCP: SMTP engine, message builder, idempotent outbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
openmail-core.workspace = true
secrecy.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
# Crate-local pins (kept out of [workspace.dependencies] to avoid cross-branch merge conflicts).
# lettre: rustls only (no native-tls, no `tracing` feature: its SMTP command logging could include AUTH data).
lettre = { version = "0.11.24", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls-tls"] }
# `bundled` so behaviour does not depend on the host's libsqlite3 version.
rusqlite = { version = "0.43", features = ["bundled"] }
idna = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[lints]
workspace = true
