[package]
name = "openmail-mcp"
description = "OpenMail MCP: rmcp server, read/search tools, stdio transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
openmail-briefs.workspace = true
openmail-core.workspace = true
openmail-observe = { path = "../openmail-observe" }
openmail-security.workspace = true
openmail-smtp.workspace = true
base64.workspace = true
rmcp.workspace = true
sha2.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
rmcp = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "time"] }

[lints]
workspace = true
