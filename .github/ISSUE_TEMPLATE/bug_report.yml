name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste passwords, tokens or real mail content. Redact hostnames and addresses if needed.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `openmail-mcp --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and install method
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Mail provider
      options: [Gmail, Microsoft 365, Fastmail, iCloud, Yahoo, Proton Bridge, Generic IMAP, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted `openmail-mcp doctor` output or logs
      render: text
