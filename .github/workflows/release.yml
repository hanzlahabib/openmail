# Release pipeline. Pushing a tag `vX.Y.Z` builds every target, writes SHA-256SUMS,
# a CycloneDX SBOM and build-provenance attestations, then creates a DRAFT GitHub
# release for a human to review and publish.
#
# NOT code-signed / NOT notarized: macOS and Windows binaries carry no Apple
# Developer ID signature, notarization ticket, or Authenticode signature. Users
# will see Gatekeeper / SmartScreen warnings. Verify downloads with SHA-256SUMS
# and `gh attestation verify <file> --repo <owner>/<repo>`.
#
# crates.io and Docker publishing exist below but run ONLY from a manual
# workflow_dispatch with the matching input ticked; a tag push never runs them.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true
        type: string
      publish_crates:
        description: "Publish crates to crates.io (disabled by default)"
        type: boolean
        default: false
      publish_docker:
        description: "Build and push the Docker image (disabled by default)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: openmail-mcp
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # provenance attestation (OIDC)
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, archive: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, archive: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-2022, archive: zip }
          - { target: aarch64-apple-darwin, os: macos-15, archive: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-15-intel, archive: tar.gz }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          # Exact version, not `stable`, so a rebuild of the tag uses the same compiler.
          rustup toolchain install 1.100.0 --profile minimal --target "${{ matrix.target }}"
          rustup default 1.100.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          # Reproducibility inputs (see docs/SUPPLY_CHAIN.md): fixed timestamp and path remapping.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export RUSTFLAGS="--remap-path-prefix=$PWD=/build --remap-path-prefix=$HOME/.cargo=/cargo"
          cargo build --release --locked -p openmail-cli --bin "$BIN_NAME" --target "${{ matrix.target }}"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="${BIN_NAME}-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          ext=""
          if [[ "${{ matrix.archive }}" == "zip" ]]; then ext=".exe"; fi
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${ext}" "dist/$name/"
          for f in LICENSE LICENSE-MIT LICENSE-APACHE README.md; do
            if [[ -f "$f" ]]; then cp "$f" "dist/$name/"; fi
          done
          mkdir -p out
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd dist && 7z a -tzip "../out/$name.zip" "$name" >/dev/null)
          else
            export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
            if tar --version 2>/dev/null | grep -q GNU; then
              # Deterministic archive: sorted names, fixed mtime/owner, no gzip timestamp.
              tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
                -C dist -cf - "$name" | gzip -n > "out/$name.tar.gz"
            else
              echo "::warning::bsdtar lacks --sort; this archive is not byte-reproducible (the binary inside still is)"
              tar -C dist -czf "out/$name.tar.gz" "$name"
            fi
          fi
          ls -l out

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --spec-version 1.5 --override-filename openmail-sbom.cdx
          mkdir -p out
          # One BOM per workspace crate; the CLI crate's BOM describes the shipped binary.
          cp crates/openmail-cli/openmail-sbom.cdx.json "out/${BIN_NAME}-${RELEASE_TAG}.sbom.cdx.json"
      - name: Attest SBOM
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: out/*
          if-no-files-found: error

  draft-release:
    name: draft release
    needs: [build, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Write SHA-256SUMS
        run: scripts/checksums.sh assets SHA-256SUMS
      - name: Create DRAFT release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="Binaries are NOT code-signed or notarized (no Apple Developer ID / notarization, no Windows Authenticode). Expect Gatekeeper/SmartScreen warnings. Verify with SHA-256SUMS and \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`. Build provenance and a CycloneDX SBOM are attached."
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft "${prerelease[@]}" \
            --verify-tag --title "$RELEASE_TAG" --notes "$notes" assets/*

  # Disabled unless started manually with publish_crates=true. Needs the
  # `crates-io` environment (with required reviewers) holding CARGO_REGISTRY_TOKEN.
  publish-crates:
    name: publish to crates.io
    if: github.event_name == 'workflow_dispatch' && inputs.publish_crates
    needs: [draft-release]
    runs-on: ubuntu-24.04
    environment: crates-io
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Publish workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked

  # Disabled unless started manually with publish_docker=true. The repo has no
  # Dockerfile yet; the job fails fast if one is missing. The image must run as a
  # non-root user (USER in the Dockerfile).
  publish-docker:
    name: publish docker image
    if: github.event_name == 'workflow_dispatch' && inputs.publish_docker
    needs: [draft-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Require Dockerfile
        run: test -f Dockerfile || { echo "no Dockerfile in repo"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}
