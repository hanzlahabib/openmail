[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/OWNER/openmail-mcp" # TODO(owner): set when the public repo is approved
authors = ["OpenMail MCP contributors"]

[workspace.dependencies]
openmail-core = { path = "crates/openmail-core" }
openmail-imap = { path = "crates/openmail-imap" }
openmail-smtp = { path = "crates/openmail-smtp" }
openmail-security = { path = "crates/openmail-security" }
openmail-mcp = { path = "crates/openmail-mcp" }
openmail-briefs = { path = "crates/openmail-briefs" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
tracing = "0.1"
secrecy = "0.10"
base64 = "0.22"
sha2 = "0.10"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
ammonia = "4"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
futures = "0.3"
mail-parser = { version = "1", features = ["full_encoding"] }
rcgen = "0.14"
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
print_stdout = "warn" # stdout is the MCP JSON-RPC channel in stdio mode

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
