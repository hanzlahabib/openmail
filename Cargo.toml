[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/OWNER/openmail-mcp" # TODO(owner): set when the public repo is approved
authors = ["OpenMail MCP contributors"]

[workspace.dependencies]
openmail-core = { path = "crates/openmail-core" }
openmail-imap = { path = "crates/openmail-imap" }
openmail-smtp = { path = "crates/openmail-smtp" }
openmail-security = { path = "crates/openmail-security" }
openmail-mcp = { path = "crates/openmail-mcp" }
openmail-briefs = { path = "crates/openmail-briefs" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
tracing = "0.1"
rmcp = { version = "3.11", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
secrecy = "0.10"
base64 = "0.22"
sha2 = "0.10"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
getrandom = "0.4"
keyring = "4"
rusqlite = { version = "0.43", features = ["bundled"] }
subtle = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
print_stdout = "warn" # stdout is the MCP JSON-RPC channel in stdio mode

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
