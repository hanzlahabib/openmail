# cargo-deny policy for OpenMail MCP. Run: scripts/audit.sh  (see docs/SUPPLY_CHAIN.md)

[graph]
all-features = true

[advisories]
# Vulnerabilities, unmaintained and unsound crates all fail the check.
# An entry in `ignore` is only acceptable with a written justification in
# docs/SUPPLY_CHAIN.md ("Accepted advisories") and a reason string here.
yanked = "deny"
unmaintained = "all"
ignore = [
    # Review by 2027-02-20. pin-utils 0.1.1 is archived but is only a tiny macro crate
    # (no unsafe-soundness or vulnerability advisory); the sole path is async-imap 0.12.0
    # (latest release), which we cannot patch. Drop this entry when async-imap moves to
    # core::pin::pin! / pin-project-lite, or replace async-imap.
    { id = "RUSTSEC-2026-0441", reason = "unmaintained pin-utils via async-imap 0.12.0 (latest); no safe upgrade; review 2027-02-20" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    # Beyond the base policy; both permissive, added after the first run
    # flagged them (see docs/SUPPLY_CHAIN.md "License additions"):
    "Zlib",                  # foldhash (hashbrown <- rusqlite)
    "CDLA-Permissive-2.0",   # webpki-root-certs (CA bundle data, via reqwest)
    "0BSD",                  # quoted_printable (lettre); public-domain-equivalent, OSI approved
]

[bans]
multiple-versions = "warn"
# "warn", not "deny": workspace crates have no `publish = false`, so cargo-deny
# treats their versionless path deps as public wildcards. Flip to "deny" once
# the crates are marked publish = false (needs a workspace Cargo.toml change).
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
