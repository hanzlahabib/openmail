services:
  openmail-mcp:
    build: .
    image: openmail-mcp:local
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Secrets (bearer token, provider credentials) come from a 0600 file you create; never commit it.
    env_file: .env
    environment:
      OPENMAIL_LOG: info
    volumes:
      - ./examples/docker/config.toml:/config/config.toml:ro
    ports:
      # Loopback only on the host; put a TLS reverse proxy in front for remote access.
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8765"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
